<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OlympCore Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="mark">OC</span>
        <div>
          <h1>OlympCore</h1>
          <p data-i18n="tagline">Демо математических методов C++</p>
        </div>
      </div>

      <div class="language-toggle" aria-label="Language">
        <button class="lang-button active" data-lang="ru" type="button">RU</button>
        <button class="lang-button" data-lang="en" type="button">EN</button>
      </div>

      <label class="field">
        <span data-i18n="searchLabel">Поиск метода</span>
        <input id="methodSearch" type="search" autocomplete="off">
      </label>

      <label class="field">
        <span data-i18n="groupLabel">Группа</span>
        <select id="groupFilter"></select>
      </label>

      <label class="field">
        <span data-i18n="statusLabel">Статус</span>
        <select id="statusFilter"></select>
      </label>

      <div id="catalogStats" class="catalog-stats"></div>
      <nav id="methodList" class="method-list" aria-label="Методы"></nav>
    </aside>

    <section class="workspace">
      <section class="stage">
        <div class="stage-head">
          <div>
            <p id="methodGroupLabel">Сводка</p>
            <h2 id="methodTitle">Описательная статистика</h2>
          </div>
          <span id="methodStatus" class="status status-ready">готово</span>
        </div>

        <p id="methodDescription" class="method-description"></p>

        <section class="method-panel" aria-labelledby="methodTitle">
          <div class="panel-head">
            <h3 data-i18n="parametersTitle">Параметры</h3>
            <button id="sampleButton" class="icon-button" title="Загрузить пример">↻</button>
          </div>
          <div id="inputPanel" class="input-grid"></div>
          <div class="panel-actions">
            <button id="runButton" class="primary-button" type="button" data-i18n="runMethod">Выполнить</button>
            <span id="methodNote" class="method-note"></span>
          </div>
        </section>

        <canvas id="chart" width="1200" height="520" aria-label="График"></canvas>

        <div id="metrics" class="metrics"></div>
        <pre id="jsonOutput" class="json"></pre>

        <section class="method-catalog" aria-labelledby="catalogTitle">
          <div class="catalog-head">
            <div>
              <p id="catalogEyebrow" data-i18n="catalogEyebrow">Карта библиотеки</p>
              <h3 id="catalogTitle" data-i18n="catalogTitle">Методы OlympCore</h3>
            </div>
            <select id="catalogFilter" aria-label="Фильтр методов"></select>
          </div>
          <div id="methodCatalog" class="method-grid"></div>
        </section>
      </section>
    </section>
  </main>

  <script src="methods.js"></script>
  <script src="calculators.js"></script>
  <script src="panels.js"></script>
  <script src="app.js"></script>
</body>
</html>
